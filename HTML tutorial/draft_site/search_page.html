<!doctype html>
<html lang="en-US">
    <head>
        <meta charset="utf-8">
        <!-- Good to include charset just to prevent weird errors later on. -->
        <meta name="viewport" content="width=device-width"/>
        <meta name="author" content="Breel">
        <meta name="description" content="A search page for Breel comics.">
        
        <title>Search | Breel Comix</title>
        <link rel="icon" href="smileicon.ico" type="image/x-icon" />

        
    </head>

    <body>
        <header>
            <h1>Search</h1>
            <form action="search_page.html" method="get">
                <label for="search">Search tags:</label>
                <br />
                <input type="search" name="search" id="search"/> <button>Search</button>
                <br />
                <input type="checkbox" name="title" id="title">
                <label for="title">Search page titles too</label>
                <br />
                <input type="checkbox" name="desc" id="desc">
                <label for="desc">Search image descriptions too</label>
                
            </form>
        </header>

        
    </body>

</html>
